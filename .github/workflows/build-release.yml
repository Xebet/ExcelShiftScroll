name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore ExcelShiftScroll.sln --configfile NuGet.Config --locked-mode

      - name: Select package version
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '0.1.0' }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release
        run: dotnet build ExcelShiftScroll.sln --configuration Release --no-restore -p:Version=${{ env.RELEASE_VERSION }}

      - name: Run automated tests
        run: dotnet test ExcelShiftScroll.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=ExcelShiftScroll.Tests.trx"

      - name: Package x64 and x86 releases
        shell: pwsh
        run: ./build/Package-Release.ps1 -Version '${{ env.RELEASE_VERSION }}'

      - name: Verify packaged files and checksums
        shell: pwsh
        run: ./build/Verify-Release.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ExcelShiftScroll-release
          path: artifacts/release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/release/* --title "ExcelShiftScroll ${{ github.ref_name }}" --generate-notes --verify-tag
